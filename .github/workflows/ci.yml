name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only one CI run per branch — newer pushes cancel earlier in-flight runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python compile + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every script + module must at least parse. Catches the kind of
      # typo that makes Railway's container crash on import without
      # surfacing the error in our local `tsc -b` check.
      - name: Compile-check every .py file
        run: |
          set -e
          find . -name '*.py' \
            -not -path './ui/node_modules/*' \
            -not -path './.git/*' \
            -print0 \
          | xargs -0 -n 32 python -m py_compile

      # Import-check the catalog + parser. These are the modules whose
      # init runs on container start; any runtime error here kills the
      # whole api_server boot. No heavy deps (rasterio etc.) — we don't
      # install those in CI because they'd require GDAL system libs.
      - name: Import-check core modules
        run: |
          set -e
          cd src
          python -c "from storm_catalog.catalog import HISTORICAL_STORMS, get_sidebar_storms; print(f'catalog OK: {len(HISTORICAL_STORMS)} curated')"
          python -c "from storm_catalog.hurdat2_parser import _is_us_mainland_landfall; print('hurdat2 OK')"

  frontend:
    name: Frontend tsc + vite build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Railway runs `tsc -b && vite build`, not `tsc --noEmit` — they
      # behave differently with project references. Match the deploy
      # command exactly so CI catches the same errors Railway would.
      - name: TypeScript build (matches Railway)
        run: npx tsc -b

      - name: Vite build
        run: npx vite build
