<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SurgeDPS — Storm Surge Damage Analysis</title>
    <meta name="description" content="Interactive storm-surge damage maps for Atlantic hurricanes. Building-level flood depth and HAZUS damage estimates for Katrina, Sandy, Ian, and every major US landfall — plus live modeling when a storm threatens the coast." />
    <link rel="canonical" href="https://stormdps.com/surgedps" />
    <meta name="theme-color" content="#0f172a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SurgeDPS" />
    <meta property="og:title" content="SurgeDPS — Storm Surge Damage Analysis" />
    <meta property="og:description" content="Building-level storm-surge flood and damage maps for historic and active Atlantic hurricanes." />
    <meta property="og:url" content="https://stormdps.com/surgedps" />
    <meta name="twitter:card" content="summary" />

    <!-- Preconnect to the basemap tile origin. Lighthouse mobile reported
         the dark-matter style.json fetch alone added ~1.7 s to the critical
         path; preconnecting opens the TCP + TLS handshake during the HTML
         parse so by the time the map needs tiles the connection is live. -->
    <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
    <link rel="dns-prefetch" href="https://basemaps.cartocdn.com" />

    <!-- Preconnect to CARTO tile servers used at runtime (sub-domains rotate
         a-d.basemaps.cartocdn.com). dns-prefetch is cheap and covers all of
         them; an explicit preconnect to the wildcard isn't possible. -->
    <link rel="dns-prefetch" href="https://a.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://b.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://c.basemaps.cartocdn.com" />
    <link rel="dns-prefetch" href="https://d.basemaps.cartocdn.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
